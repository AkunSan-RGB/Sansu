# CI otomatis: setiap push ke main dan setiap pull request menjalankan pemeriksaan tipe,
# tes unit, build web, dan seluruh tes end-to-end API di PostgreSQL sungguhan.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cek:
    name: Tipe, tes unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @sansu/web
      - run: npm run build -w @sansu/api

  e2e:
    name: Tes end-to-end API
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: akurata
          POSTGRES_PASSWORD: akurata
          POSTGRES_DB: akurata_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U akurata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Siapkan konfigurasi tes (nilai palsu, hanya untuk CI)
        working-directory: backend
        run: |
          cat > .env.test <<'ENV'
          DATABASE_URL="postgresql://akurata:akurata@localhost:5432/akurata_test"
          JWT_SECRET="test-secret-test-secret-test-secret"
          NODE_ENV=test
          ENV
      - run: npm run test:e2e -w @sansu/api
