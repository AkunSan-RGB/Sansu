# Konfigurasi Netlify untuk tampilan web SANSU (apps/web).
# Netlify hanya menampung tampilan. API (NestJS) harus berjalan di server lain (Render, Railway, VPS, ...) — isi alamatnya di bawah.

[build]
  command = "npm ci && npm run build -w @sansu/shared && npm run build -w @sansu/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# 1) Panggilan /api/* diteruskan ke server API. GANTI alamatnya dengan alamat API Anda (tanpa garis miring di akhir).
#    Selama alamat ini belum diganti, halaman terbuka tetapi login belum bisa.
[build]
  base = "apps/web"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true