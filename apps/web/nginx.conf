server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  # Impor mutasi bank / pesanan marketplace bisa besar
  client_max_body_size 25m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Aset ber-hash dari Vite boleh di-cache lama
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html jangan di-cache agar pengguna langsung mendapat versi terbaru setelah update
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: semua rute lain diarahkan ke index.html
  location / {
    try_files $uri /index.html;
  }
}
